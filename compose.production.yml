name: voreli

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    image: voreli-minio:local
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    image: voreli-server:${RELEASE_TAG:?Set RELEASE_TAG}
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-3000}
      LISTEN_HOST: 127.0.0.1
      CORS_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_HOPS: "1"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?Set MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-40100}
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN:?Set S3_DOMAIN}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  migrate:
    profiles: [tools]
    image: voreli-server:${RELEASE_TAG:?Set RELEASE_TAG}
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    command:
      [
        "apps/server/node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema",
        "apps/server/prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        VITE_SERVER_URL: ""
    image: voreli-web:${RELEASE_TAG:?Set RELEASE_TAG}
    restart: unless-stopped
    network_mode: host
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN:?Set S3_DOMAIN}
      SERVER_PORT: ${SERVER_PORT:-3000}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
