packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@swc/core': set this to true or false
  esbuild: set this to true or false

# Native binaries these two ship are required (esbuild powers Vite, SWC powers the
# decorator-aware test transform), so their install scripts are allowed explicitly.
onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
