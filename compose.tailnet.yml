name: voreli-tailnet

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.tailnet.postgres
    environment:
      POSTGRES_USER: voreli
      POSTGRES_DB: voreli
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voreli -d voreli"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    image: voreli-minio:tailnet
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}:8443
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    image: voreli-server:tailnet
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "13000"
      LISTEN_HOST: 127.0.0.1
      CORS_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}:8443
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_HOPS: "1"
      DATABASE_URL: ${TAILNET_DATABASE_URL:?Set TAILNET_DATABASE_URL}
      REDIS_URL: redis://127.0.0.1:16379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_ANNOUNCED_IP:?Set MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?Set MEDIASOUP_ANNOUNCED_IP}
      MEDIASOUP_MAX_WORKERS: "1"
      MEDIASOUP_RTC_MIN_PORT: "40000"
      MEDIASOUP_RTC_MAX_PORT: "40000"
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_PUBLIC_ENDPOINT: https://${APP_DOMAIN:?Set APP_DOMAIN}:10000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: voreli
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  migrate:
    profiles: [tools]
    image: voreli-server:tailnet
    network_mode: host
    environment:
      DATABASE_URL: ${TAILNET_DATABASE_URL:?Set TAILNET_DATABASE_URL}
    command:
      [
        "apps/server/node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema",
        "apps/server/prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    profiles: [tools]
    image: voreli-server:tailnet
    network_mode: host
    env_file: .env.tailnet.bootstrap
    environment:
      DATABASE_URL: ${TAILNET_DATABASE_URL:?Set TAILNET_DATABASE_URL}
    command: ["node", "apps/server/dist/tailnet-bootstrap.js"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        VITE_SERVER_URL: ""
    image: voreli-web:tailnet
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/tailnet/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
  minio-data:
