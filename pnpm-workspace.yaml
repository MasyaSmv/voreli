packages:
  - "apps/*"
  - "packages/*"

# These packages need their install scripts: esbuild powers Vite, SWC powers the
# decorator-aware test transform, argon2 unpacks a native binding, Prisma generates its
# client and downloads query engines. Everything else is denied by default.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  argon2: true
  esbuild: true
  prisma: true
