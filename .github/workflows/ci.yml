name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Tests run against real dependencies, never against mocks (docs/AGENTS.md), so CI has
    # to provide them. The health checks keep the job from starting before they answer.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voreli
          POSTGRES_PASSWORD: voreli
          POSTGRES_DB: voreli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voreli -d voreli_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The app does not merely cache in Redis: the domain event bus, the permission cache
      # and the rate limiter all connect at startup, so without this service every test
      # that boots the application hangs in its own `beforeAll` and times out.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # There is no .env in CI; every variable the app validates is passed explicitly.
      NODE_ENV: test
      DATABASE_URL: postgresql://voreli:voreli@localhost:5432/voreli_test?schema=public
      DATABASE_URL_TEST: postgresql://voreli:voreli@localhost:5432/voreli_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-that-is-long-enough-32
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      VITE_SERVER_URL: ""
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: voreli
      S3_SECRET_KEY: voreli-ci-storage-secret
      S3_BUCKET: voreli_test
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Start private object storage for upload integration tests
        run: |
          docker build --tag voreli-minio:local docker/minio
          docker run --detach --name voreli-ci-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            voreli-minio:local server /data
          # Docker can accept the connection before MinIO is listening, then reset it.
          if ! curl --fail --retry 20 --retry-delay 1 --retry-all-errors \
            --max-time 2 http://localhost:9000/minio/health/ready; then
            docker logs voreli-ci-minio
            exit 1
          fi

      - name: Install image worker resource limits
        run: |
          sudo apt-get update
          sudo apt-get install --yes util-linux

      - run: pnpm verify

      - name: Install Chromium and PulseAudio device harness
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl info

      - run: pnpm e2e --project=browser

      - run: xvfb-run --auto-servernum pnpm e2e:devices
        env:
          VORELI_REQUIRE_PULSE_AUDIO: "1"
